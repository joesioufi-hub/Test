<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Figma JSON Render</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="viewport" class="viewport" aria-label="Figma viewport"></div>
    </div>

    <script src="./figma-data.js"></script>
    <script src="./renderer.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const data = window.FIGMA_DATA;
        const imageMap = window.IMAGE_MAP || {};
        const viewport = document.getElementById('viewport');

        if (!data) {
          console.warn('No FIGMA_DATA found. Add your design JSON to figma-data.js');
          return;
        }

        window.renderFigmaTo(viewport, data, { imageMap });
      });
    </script>
  </body>
  </html>
